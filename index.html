<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Romantic Live</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160c24;color:white;font-family:Arial}
header{background:#29123d;padding:20px;text-align:center}
header h2{color:#ff55ae}
nav{display:flex;justify-content:space-around;flex-wrap:wrap;
background:#29123d;padding:12px 2px;position:sticky;top:0}
nav button{background:none;border:0;color:white;padding:8px;font-size:13px}
main{padding:16px;padding-bottom:90px}
.card{background:#321a47;border-radius:15px;padding:16px;margin:12px 0}
h3{color:#ff75bc}
button.action{background:#ed3997;color:white;border:0;
border-radius:22px;padding:12px 18px;margin:5px}
input{width:100%;padding:13px;margin:8px 0;
border:0;border-radius:9px}
.room{display:inline-block;background:#48245f;
padding:15px;border-radius:12px;margin:5px}
footer{text-align:center;color:#bbb;padding:20px}
#status{color:#ff91c8;word-break:break-word}
</style>
</head>
<body>

<header>
<h2>❤️ Love Romantic Live</h2>
<p>Make Friends • Share Love • Enjoy Together</p>
<p id="status">Welcome Guest</p>
</header>

<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('live')">Live</button>
<button onclick="show('audio')">Audio</button>
<button onclick="show('rooms')">Rooms</button>
<button onclick="show('chat')">Chat</button>
<button onclick="show('profile')">Profile</button>
</nav>

<main id="content"></main>
<footer>❤️ Love Romantic Live ❤️</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
// FIREBASE CONFIGURATION
const firebaseConfig = {
apiKey: "AIzaSyCl6sD3qUjyTKOBi1ZXRk9V0-ZxFW6XyAI",
authDomain: "love-romantic-2d975.firebaseapp.com",
projectId: "love-romantic-2d975",
storageBucket: "love-romantic-2d975.firebasestorage.app",
messagingSenderId: "1073381907111",
appId: "1:1073381907111:web:ba6ca68172439439511982",
measurementId: "G-1X1LNX32HP"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
auth.languageCode = "en";

let confirmationResult = null;
let recaptchaVerifier = null;

function message(msg){
alert(msg);
}

function show(page){
let c=document.getElementById('content');

if(page==='home'){
c.innerHTML=`
<h3>Welcome to Love Romantic ❤️</h3>
<div class="card">
<h3>🔴 Live Streaming</h3>
<p>Watch live broadcasts and meet friends.</p>
<button class="action" onclick="show('live')">Explore Live</button>
</div>
<div class="card">
<h3>🎤 Audio Rooms</h3>
<p>Talk with friends in audio rooms.</p>
<button class="action" onclick="show('audio')">Join Audio</button>
</div>
<div class="card">
<h3>📹 Video Rooms</h3>
<p>4, 6, 9 and 12 seats.</p>
<button class="action" onclick="show('rooms')">Explore Rooms</button>
</div>
<div class="card">
<h3>👤 Account</h3>
<button class="action" onclick="show('login')">Login / Signup</button>
</div>`;
}

if(page==='login'){
c.innerHTML=`
<h3>Login / Signup ❤️</h3>
<div class="card">
<h3>Mobile Number Login</h3>
<input id="phone" type="tel"
placeholder="+91 9876543210">
<div id="recaptcha-container"></div>
<button class="action" onclick="sendOTP()">Send OTP</button>
<div id="otp-area"></div>
<hr>
<h3>Google Login</h3>
<button class="action" onclick="googleLogin()">
Continue with Google
</button>
</div>`;
}

if(page==='live'){
c.innerHTML=`
<h3>🔴 Live Streaming</h3>
<div class="card">
<p>Live streaming service is not connected yet.</p>
</div>`;
}

if(page==='audio'){
c.innerHTML=`
<h3>🎤 Audio Rooms</h3>
<div class="card">
<p>Audio room service is not connected yet.</p>
</div>`;
}

if(page==='rooms'){
c.innerHTML=`
<h3>📹 Video Rooms</h3>
${[4,6,9,12].map(n=>`
<div class="room">${n} Seats<br>
<button class="action" onclick="join(${n})">Join</button>
</div>`).join('')}`;
}

if(page==='chat'){
c.innerHTML=`
<h3>💬 Private Chat</h3>
<div class="card">
<p>Chat service will be connected in the next development step.</p>
</div>`;
}

if(page==='profile'){
let user=auth.currentUser;

if(user){
c.innerHTML=`
<h3>👤 My Profile</h3>
<div class="card">
<p>Name: ${escapeText(user.displayName || "User")}</p>
<p>Email: ${escapeText(user.email || "Not available")}</p>
<p>Phone: ${escapeText(user.phoneNumber || "Not available")}</p>
<button class="action" onclick="logout()">Logout</button>
</div>`;
}else{
c.innerHTML=`
<h3>👤 My Profile</h3>
<div class="card">
<p>Please login to see your profile.</p>
<button class="action" onclick="show('login')">Login</button>
</div>`;
}
}
}

function escapeText(value){
return String(value).replace(/[&<>"']/g, ch => ({
'&':'&amp;','<':'&lt;','>':'&gt;',
'"':'&quot;',"'":'&#39;'
}[ch]));
}

// MOBILE OTP
async function sendOTP(){
try{
const phone=document.getElementById('phone').value.trim();

if(!/^\+[1-9]\d{7,14}$/.test(phone)){
message("Enter mobile number with country code. Example: +919876543210");
return;
}

if(recaptchaVerifier){
recaptchaVerifier.clear();
recaptchaVerifier=null;
}

recaptchaVerifier=new firebase.auth.RecaptchaVerifier(
'recaptcha-container',
{size:'normal'},
auth
);

await recaptchaVerifier.render();

confirmationResult=await auth.signInWithPhoneNumber(
phone,
recaptchaVerifier
);

document.getElementById('otp-area').innerHTML=`
<input id="otp" type="text"
inputmode="numeric" placeholder="Enter OTP">
<button class="action" onclick="verifyOTP()">Verify OTP</button>
`;

message("OTP sent. Please check your phone.");

}catch(error){
console.error(error);
message("OTP Error: "+error.message);
if(recaptchaVerifier){
recaptchaVerifier.clear();
recaptchaVerifier=null;
}
}
}

// VERIFY OTP
async function verifyOTP(){
try{
const otp=document.getElementById('otp').value.trim();

if(!otp){
message("Please enter OTP");
return;
}

await confirmationResult.confirm(otp);
message("Login successful ❤️");
show('profile');

}catch(error){
console.error(error);
message("OTP verification failed: "+error.message);
}
}

// GOOGLE LOGIN
async function googleLogin(){
try{
const provider=new firebase.auth.GoogleAuthProvider();
await auth.signInWithPopup(provider);
message("Google Login successful ❤️");
show('profile');

}catch(error){
console.error(error);
message("Google Login Error: "+error.message);
}
}

// LOGOUT
async function logout(){
try{
await auth.signOut();
message("You are logged out");
show('home');
}catch(error){
message(error.message);
}
}

// AUTH STATUS
auth.onAuthStateChanged(user=>{
const status=document.getElementById('status');

if(user){
status.textContent="Logged in: "+(user.displayName || user.phoneNumber || user.email);
}else{
status.textContent="Welcome Guest";
}
});

function join(n){
document.getElementById('content').innerHTML=`
<h3>🎤 ${n} Seat Room</h3>
<div class="card">
<p>${n} guest room selected.</p>
<p>Video service is not connected yet.</p>
<button class="action" onclick="show('rooms')">Back</button>
</div>`;
}

show('home');
</script>
</body>
</html>
