
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Love Romantic</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160c24;color:white;font-family:Arial}
header{background:#29123d;padding:20px;text-align:center}
header h2{color:#ff55ae}
nav{display:flex;justify-content:space-around;background:#29123d;padding:14px 2px;position:sticky;top:0}
nav button{background:none;border:0;color:white;font-size:13px}
main{padding:16px;padding-bottom:90px}
.card{background:#321a47;border-radius:15px;padding:16px;margin:12px 0}
h3{color:#ff75bc}
button.action{background:#ed3997;color:white;border:0;border-radius:22px;padding:12px 18px;margin:5px}
input{width:100%;padding:13px;margin:8px 0;border:0;border-radius:9px}
.room{display:inline-block;background:#48245f;padding:15px;border-radius:12px;margin:5px}
footer{text-align:center;color:#bbb;padding:20px}
</style>
</head>
<body>
<header>
<h2>❤️ Love Romantic</h2>
<p>Make Friends • Share Love • Enjoy Together</p>
</header>
<nav>
<button onclick="show('home')">Home</button>
<button onclick="show('live')">Live</button>
<button onclick="show('audio')">Audio</button>
<button onclick="show('rooms')">Rooms</button>
<button onclick="show('chat')">Chat</button>
<button onclick="show('profile')">Profile</button>
</nav>
<main id="content"></main>
<footer>❤️ Love Romantic ❤️</footer>
<script>
function show(page){
let c=document.getElementById('content');

if(page==='home'){
c.innerHTML=`
<h3>Welcome to Love Romantic ❤️</h3>
<div class="card">
<h3>🔴 Live Streaming</h3>
<p>Watch live broadcasts and meet friends.</p>
<button class="action" onclick="show('live')">Explore Live</button>
</div>
<div class="card">
<h3>🎤 Audio Rooms</h3>
<p>Talk with friends in audio rooms.</p>
<button class="action" onclick="show('audio')">Join Audio</button>
</div>
<div class="card">
<h3>📹 Video Rooms</h3>
<p>4, 6, 9 and 12 seats available.</p>
<button class="action" onclick="show('rooms')">Explore Rooms</button>
</div>
<div class="card">
<h3>👤 Account</h3>
<button class="action" onclick="show('login')">Login / Signup</button>
</div>`;
}

if(page==='login'){
c.innerHTML=`
<h3>Login / Signup ❤️</h3>
<div class="card">
<input id="phone" placeholder="Mobile Number">
<button class="action" onclick="alert('OTP service setup required')">Continue with Mobile</button>
<button class="action" onclick="alert('Google Firebase setup required')">Google Login</button>
</div>`;
}

if(page==='live'){
c.innerHTML=`
<h3>🔴 Live Streaming</h3>
<div class="card">
<p>No live broadcasts yet.</p>
<button class="action" onclick="alert('Live streaming server required')">Go Live</button>
</div>`;
}

if(page==='audio'){
c.innerHTML=`
<h3>🎤 Audio Rooms</h3>
<div class="card">
<p>Join an audio room and talk with friends.</p>
<button class="action" onclick="alert('Audio streaming service required')">Create Audio Room</button>
</div>`;
}

if(page==='rooms'){
c.innerHTML=`
<h3>📹 Video Rooms</h3>
${[4,6,9,12].map(n=>`
<div class="room">${n} Seats<br>
<button class="action" onclick="join(${n})">Join</button>
</div>`).join('')}`;
}

if(page==='chat'){
c.innerHTML=`
<h3>💬 Private Chat</h3>
<div class="card">
<p>Chat feature requires Firebase connection.</p>
<input placeholder="Search friends">
<button class="action" onclick="alert('Chat backend required')">Start Chat</button>
</div>`;
}

if(page==='profile'){
c.innerHTML=`
<h3>👤 My Profile</h3>
<div class="card">
<p>Welcome to Love Romantic</p>
<p>Followers: 0</p>
<p>Following: 0</p>
<button class="action" onclick="show('login')">Login</button>
</div>
<div class="card">
<h3>🎁 Gifts & Wallet</h3>
<p>Wallet service setup required.</p>
</div>`;
}
}

function join(n){
document.getElementById('content').innerHTML=`
<h3>🎤 ${n} Seat Room</h3>
<div class="card">
<p>${n} guest room selected.</p>
<p>Live video service needs to be connected.</p>
<button class="action" onclick="show('rooms')">Back</button>
</div>`;
}
show('home');
</script>
</body>
</html>
